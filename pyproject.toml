[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catan-ml"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "numpy==2.0.2",
    "pandas==2.3.3",
    "pyarrow==21.0.0",
    "scikit-learn==1.6.1",
    "matplotlib==3.9.4",
    "joblib==1.5.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
]

[tool.setuptools.packages.find]
include = ["catan_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
